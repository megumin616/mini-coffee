<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สินค้าทั้งหมด — Mini Shopee</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <nav class="bg-orange-500 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="text-2xl font-bold">🛒 Cafe’ In The Garden</a>

      <!-- Search Bar -->
      <div class="hidden md:flex flex-1 mx-8">
        <input id="search-input" type="text" placeholder="ค้นหาสินค้า..."
               class="flex-1 rounded-l-lg px-4 py-2 text-gray-800 text-sm focus:outline-none" />
        <button onclick="searchProducts()"
                class="bg-orange-700 hover:bg-orange-800 px-4 py-2 rounded-r-lg text-sm transition">
          🔍
        </button>
      </div>

      <div class="flex items-center gap-4 text-sm font-medium">
        <a id="nav-orders" href="my-orders.html" class="hidden hover:text-orange-100 transition">📦 คำสั่งซื้อ</a>
        <a href="cart.html" class="relative hover:text-orange-100">
          🛍️ ตะกร้า
          <span id="nav-cart-badge"
                class="hidden absolute -top-2 -right-3 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
        </a>
        <span id="nav-user" class="hidden text-orange-100"></span>
        <a id="nav-admin" href="admin.html"
           class="hidden bg-white text-orange-500 px-3 py-1 rounded-full text-xs font-bold">Admin</a>
        <button id="nav-logout" onclick="logout()"
                class="hidden bg-orange-600 hover:bg-orange-700 px-3 py-1 rounded transition">ออกจากระบบ</button>
        <a id="nav-login" href="login.html"
           class="bg-white text-orange-500 px-4 py-1 rounded-full font-semibold hover:bg-orange-50 transition">เข้าสู่ระบบ</a>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
    <!-- Header + Filter -->
    <div class="flex flex-col md:flex-row md:items-center justify-between mb-6 gap-3">
      <h1 class="text-2xl font-bold text-gray-800">📦 สินค้าทั้งหมด</h1>

      <!-- Category Filter -->
      <div class="flex gap-2 flex-wrap" id="category-filters">
        <button type="button" onclick="filterCategory(null)"
                class="category-btn active px-4 py-1.5 rounded-full text-sm font-medium border transition">
          ทั้งหมด
        </button>
        <button type="button" onclick="filterCategory('เมนูเครื่องดื่ม')"
                class="category-btn px-4 py-1.5 rounded-full text-sm font-medium border transition">
          เมนูเครื่องดื่ม
        </button>
        <button type="button" onclick="filterCategory('เมนูสเต็ก')"
                class="category-btn px-4 py-1.5 rounded-full text-sm font-medium border transition">
          เมนูสเต็ก
        </button>
        <button type="button" onclick="filterCategory('เมนูข้าว')"
                class="category-btn px-4 py-1.5 rounded-full text-sm font-medium border transition">
          เมนูข้าว
        </button>
        <button type="button" onclick="filterCategory('เมนูก๋วยเตี๋ยว')"
                class="category-btn px-4 py-1.5 rounded-full text-sm font-medium border transition">
          เมนูก๋วยเตี๋ยว
        </button>
        <button type="button" onclick="filterCategory('เมนูทานเล่น')"
                class="category-btn px-4 py-1.5 rounded-full text-sm font-medium border transition">
          เมนูทานเล่น
        </button>
        <button type="button" onclick="filterCategory('เมนูอื่นๆ')"
                class="category-btn px-4 py-1.5 rounded-full text-sm font-medium border transition">
          เมนูอื่นๆ
        </button>
      </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="text-center py-20 text-gray-400">
      <div class="text-5xl mb-3">⏳</div>
      <p>กำลังโหลดสินค้า...</p>
    </div>

    <!-- Product Grid -->
    <div id="product-grid" class="hidden grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-20 text-gray-400">
      <div class="text-5xl mb-3">🔍</div>
      <p>ไม่พบสินค้าที่ค้นหา</p>
    </div>
  </main>

  <footer class="bg-gray-800 text-gray-400 text-center py-6 text-sm mt-auto">
    © 2024 Mini Shopee
  </footer>

  <script src="js/api.js"></script>
  <script>
    // ============================================================
    // State ของหน้านี้
    // ============================================================
    let allProducts      = []; // เก็บสินค้าทั้งหมดที่โหลดมา
    let currentCategory  = null;
    let searchKeyword    = '';

    // ============================================================
    // โหลดข้อมูลตอนเริ่ม
    // ============================================================
    document.addEventListener('DOMContentLoaded', async () => {
      updateNavbar();
      await loadProducts();

      // Search เมื่อกด Enter
      document.getElementById('search-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchProducts();
      });
    });

    // ============================================================
    // loadProducts - ดึงสินค้าจาก API
    // ============================================================
    // Flow:
    // 1. เรียก GET /api/products (ไม่ต้อง Token)
    // 2. Server ดึงจาก MySQL → ส่ง JSON กลับ
    // 3. JavaScript รับ JSON → render เป็น HTML Cards
    // ============================================================
    const loadProducts = async () => {
      try {
        // auth = false เพราะสินค้าเป็น Public API
        const res = await apiCall('/products', 'GET', null, false);
        allProducts = res.data;

        // แสดงสินค้า
        renderProducts(allProducts);

      } catch (err) {
        document.getElementById('loading').innerHTML =
          `<p class="text-red-400">โหลดสินค้าไม่สำเร็จ: ${err.message}</p>`;
      }
    };

    // ============================================================
    // filterCategory - กรองสินค้าตาม Category
    // ============================================================
    const filterCategory = (category) => {
      currentCategory = category;
      searchKeyword   = '';
      document.getElementById('search-input').value = '';

      // อัปเดต Active Button
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent === (category || 'ทั้งหมด'));
      });

      const filtered = category
        ? allProducts.filter(p => p.category === category)
        : allProducts;

      renderProducts(filtered);
    };

    // ============================================================
    // searchProducts - ค้นหาสินค้าตามชื่อ
    // ============================================================
    const searchProducts = () => {
      searchKeyword   = document.getElementById('search-input').value.toLowerCase().trim();
      currentCategory = null;

      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent === 'ทั้งหมด');
      });

      const filtered = searchKeyword
        ? allProducts.filter(p => p.name.toLowerCase().includes(searchKeyword))
        : allProducts;

      renderProducts(filtered);
    };

    // ============================================================
    // renderProducts - วาด Product Cards
    // ============================================================
    const renderProducts = (products) => {
      const grid       = document.getElementById('product-grid');
      const loading    = document.getElementById('loading');
      const emptyState = document.getElementById('empty-state');

      loading.classList.add('hidden');

      if (products.length === 0) {
        grid.classList.add('hidden');
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      grid.classList.remove('hidden');

      grid.innerHTML = products.map(p => `
        <div class="bg-white rounded-xl shadow hover:shadow-md transition overflow-hidden flex flex-col">
          <!-- รูปสินค้า -->
          <img src="${p.image_url || 'https://picsum.photos/400/400'}"
               alt="${p.name}"
               class="w-full h-44 object-cover cursor-pointer"
               onclick="window.location.href='products.html'" />

          <!-- ข้อมูลสินค้า -->
          <div class="p-3 flex flex-col flex-1">
            <p class="text-xs text-gray-400 mb-1">${p.category || ''}</p>
            <p class="font-semibold text-gray-800 text-sm flex-1 line-clamp-2">${p.name}</p>
            <p class="text-xs text-gray-400 mt-1 line-clamp-2">${p.description || ''}</p>

            <div class="mt-3 flex items-center justify-between">
              <span class="text-orange-500 font-bold">${formatPrice(p.price)}</span>
              <span class="text-xs text-gray-400">เหลือ ${p.stock} ชิ้น</span>
            </div>

            <!-- ปุ่มเพิ่มตะกร้า -->
            <button onclick="addToCart(${p.id}, '${p.name}')"
                    ${p.stock === 0 ? 'disabled' : ''}
                    class="mt-3 w-full py-2 rounded-lg text-sm font-semibold transition
                           ${p.stock > 0
                             ? 'bg-orange-500 hover:bg-orange-600 text-white'
                             : 'bg-gray-200 text-gray-400 cursor-not-allowed'}">
              ${p.stock > 0 ? '🛍️ เพิ่มลงตะกร้า' : 'สินค้าหมด'}
            </button>
          </div>
        </div>
      `).join('');
    };

    // ============================================================
    // addToCart - เพิ่มสินค้าในตะกร้า
    // ============================================================
    // Flow:
    // 1. ตรวจว่า Login หรือยัง (ต้องมี Token)
    // 2. เรียก POST /api/cart พร้อมส่ง product_id ใน Body
    // 3. Server ตรวจ Token → เพิ่มใน Database
    // 4. แสดงข้อความสำเร็จ + อัปเดต Badge
    // ============================================================
    const addToCart = async (productId, productName) => {
      // ถ้ายังไม่ Login → พาไปหน้า Login
      if (!isLoggedIn()) {
        if (confirm('กรุณาเข้าสู่ระบบก่อนเพิ่มสินค้า\nไปหน้าเข้าสู่ระบบ?')) {
          window.location.href = 'login.html';
        }
        return;
      }

      try {
        // ส่ง product_id ไปให้ Backend
        // Header จะมี Authorization: Bearer <token> อัตโนมัติ (จาก apiCall)
        await apiCall('/cart', 'POST', { product_id: productId, quantity: 1 });
        showAlert(`เพิ่ม "${productName}" ลงตะกร้าแล้ว! 🛍️`);
        updateNavbar(); // อัปเดต Badge
      } catch (err) {
        showAlert(err.message, 'error');
      }
    };
  </script>

  <style>
    .category-btn { color: #6b7280; border-color: #d1d5db; }
    .category-btn:hover { background: #fff7ed; color: #f97316; border-color: #f97316; }
    .category-btn.active { background: #f97316; color: white; border-color: #f97316; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</body>
</html>
