<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สมัครสมาชิก — Cafe’ In The Garden</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 min-h-screen flex items-center justify-center py-10">

  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-lg p-8">
      <div class="text-center mb-6">
        <h1 class="text-3xl font-bold text-orange-500">🛒 Cafe’ In The Garden</h1>
        <p class="text-gray-500 text-sm mt-1">สมัครสมาชิกเพื่อเริ่มช้อปปิ้ง</p>
      </div>

      <div id="error-msg"   class="hidden bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-lg mb-4"></div>
      <div id="success-msg" class="hidden bg-green-50 border border-green-200 text-green-700 text-sm px-4 py-3 rounded-lg mb-4"></div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล <span class="text-red-500">*</span></label>
          <input id="name" type="text" placeholder="สมชาย ใจดี"
                 class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">อีเมล <span class="text-red-500">*</span></label>
          <input id="email" type="email" placeholder="example@email.com"
                 class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน <span class="text-red-500">*</span></label>
          <input id="password" type="password" placeholder="อย่างน้อย 6 ตัวอักษร"
                 class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">เบอร์โทรศัพท์</label>
          <input id="phone" type="tel" placeholder="0812345678"
                 class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">ที่อยู่จัดส่ง</label>
          <textarea id="address" rows="3" placeholder="บ้านเลขที่ ถนน แขวง/ตำบล เขต/อำเภอ จังหวัด รหัสไปรษณีย์"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400 resize-none"></textarea>
        </div>

        <button onclick="handleRegister()"
                class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2.5 rounded-lg transition">
          สมัครสมาชิก
        </button>
      </div>

      <p class="text-center text-sm text-gray-500 mt-4">
        มีบัญชีแล้ว?
        <a href="login.html" class="text-orange-500 font-medium hover:underline">เข้าสู่ระบบ</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // ถ้า Login อยู่แล้ว → ไปหน้าสินค้า
    if (isLoggedIn()) window.location.href = 'products.html';

    // ============================================================
    // handleRegister - ส่งข้อมูลสมัครสมาชิก
    // ============================================================
    const handleRegister = async () => {
      const name     = document.getElementById('name').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const phone    = document.getElementById('phone').value.trim();
      const address  = document.getElementById('address').value.trim();

      const errorDiv   = document.getElementById('error-msg');
      const successDiv = document.getElementById('success-msg');
      errorDiv.classList.add('hidden');
      successDiv.classList.add('hidden');

      if (!name || !email || !password) {
        errorDiv.textContent = 'กรุณากรอกชื่อ, อีเมล และรหัสผ่าน';
        errorDiv.classList.remove('hidden');
        return;
      }
      if (password.length < 6) {
        errorDiv.textContent = 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
        errorDiv.classList.remove('hidden');
        return;
      }

      try {
        await apiCall('/auth/register', 'POST', { name, email, password, phone, address }, false);

        successDiv.textContent = 'สมัครสมาชิกสำเร็จ! กำลังพาไปหน้า Login...';
        successDiv.classList.remove('hidden');

        // รอ 2 วินาที แล้วไปหน้า Login
        setTimeout(() => { window.location.href = 'login.html'; }, 2000);

      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.classList.remove('hidden');
      }
    };
  </script>
</body>
</html>
