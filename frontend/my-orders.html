<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>คำสั่งซื้อของฉัน — Mini Shopee</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <nav class="bg-orange-500 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-2">
      <a href="index.html" class="text-2xl font-bold">🛒 Mini Shopee</a>
      <div class="flex items-center gap-4 text-sm font-medium">
        <a href="products.html" class="hover:text-orange-100 transition">สินค้า</a>
        <a id="nav-orders" href="my-orders.html" class="text-orange-100 font-semibold border-b-2 border-white pb-0.5">📦 คำสั่งซื้อ</a>
        <a href="cart.html" class="relative hover:text-orange-100">
          🛍️ ตะกร้า
          <span id="nav-cart-badge"
                class="hidden absolute -top-2 -right-3 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
        </a>
        <span id="nav-user" class="hidden text-orange-100"></span>
        <a id="nav-admin" href="admin.html"
           class="hidden bg-white text-orange-500 px-3 py-1 rounded-full text-xs font-bold">Admin</a>
        <button id="nav-logout" onclick="logout()"
                class="hidden bg-orange-600 hover:bg-orange-700 px-3 py-1 rounded transition">ออกจากระบบ</button>
        <a id="nav-login" href="login.html"
           class="bg-white text-orange-500 px-4 py-1 rounded-full font-semibold hover:bg-orange-50 transition">เข้าสู่ระบบ</a>
      </div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full">
    <h1 class="text-2xl font-bold text-gray-800 mb-2">📦 คำสั่งซื้อของฉัน</h1>
    <p class="text-sm text-gray-500 mb-6">สถานะอัปเดตตามที่ร้านดำเนินการ — รีเฟรชหน้าเพื่อดูล่าสุด</p>

    <div id="loading" class="text-center py-16 text-gray-400">
      <div class="text-4xl mb-2">⏳</div>
      <p>กำลังโหลด...</p>
    </div>

    <div id="empty-state" class="hidden text-center py-16 bg-white rounded-xl shadow text-gray-500">
      <p class="text-lg mb-2">ยังไม่มีคำสั่งซื้อ</p>
      <a href="products.html" class="text-orange-500 font-semibold hover:underline">ไปเลือกสินค้า</a>
    </div>

    <div id="orders-wrap" class="hidden space-y-4"></div>
  </main>

  <div id="detail-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[85vh] overflow-y-auto">
      <div class="flex items-center justify-between p-5 border-b sticky top-0 bg-white rounded-t-2xl">
        <h3 class="font-bold text-gray-800 text-lg">รายละเอียด #<span id="modal-order-id"></span></h3>
        <button type="button" onclick="closeOrderModal()" class="text-gray-400 hover:text-gray-600 text-xl">✕</button>
      </div>
      <div class="p-5 space-y-4" id="modal-content"></div>
    </div>
  </div>

  <footer class="bg-gray-800 text-gray-400 text-center py-6 mt-auto text-sm">
    <p>© 2024 Mini Shopee</p>
  </footer>

  <script src="js/api.js"></script>
  <script>
    const statusConfig = {
      PENDING:   { label: 'รอดำเนินการ', color: 'bg-yellow-100 text-yellow-700' },
      CONFIRMED: { label: 'ยืนยันแล้ว',  color: 'bg-blue-100 text-blue-700' },
      SHIPPING:  { label: 'กำลังจัดส่ง', color: 'bg-purple-100 text-purple-700' },
      DELIVERED: { label: 'ส่งแล้ว',      color: 'bg-green-100 text-green-700' },
      CANCELLED: { label: 'ยกเลิก',       color: 'bg-red-100 text-red-700' }
    };

    document.addEventListener('DOMContentLoaded', () => {
      if (!isLoggedIn()) {
        window.location.href = 'login.html';
        return;
      }
      updateNavbar();
      loadMyOrders();
    });

    async function loadMyOrders() {
      const loading = document.getElementById('loading');
      const empty = document.getElementById('empty-state');
      const wrap = document.getElementById('orders-wrap');
      try {
        const res = await apiCall('/orders');
        const orders = res.data;
        loading.classList.add('hidden');
        if (!orders.length) {
          empty.classList.remove('hidden');
          return;
        }
        wrap.classList.remove('hidden');
        wrap.innerHTML = orders.map(o => {
          const st = statusConfig[o.status] || { label: o.status, color: 'bg-gray-100 text-gray-600' };
          const date = new Date(o.created_at).toLocaleDateString('th-TH', {
            day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
          });
          return `
            <div class="bg-white rounded-xl shadow p-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
              <div>
                <p class="font-mono font-bold text-orange-500">#${o.id}</p>
                <p class="text-xs text-gray-500">${date}</p>
                <p class="text-lg font-bold text-gray-800 mt-1">${formatPrice(o.total_price)}</p>
              </div>
              <div class="flex flex-col sm:items-end gap-2">
                <span class="inline-flex px-3 py-1 rounded-full text-xs font-medium ${st.color}">${st.label}</span>
                <button type="button" onclick="viewMyOrderDetail(${o.id})"
                        class="text-orange-500 hover:text-orange-700 text-sm font-medium underline">ดูรายละเอียด</button>
              </div>
            </div>`;
        }).join('');
      } catch (err) {
        loading.innerHTML = `<p class="text-red-500">โหลดไม่สำเร็จ: ${err.message}</p>`;
      }
    }

    async function viewMyOrderDetail(orderId) {
      document.getElementById('modal-order-id').textContent = orderId;
      document.getElementById('modal-content').innerHTML = '<p class="text-center text-gray-400 py-8">⏳ กำลังโหลด...</p>';
      document.getElementById('detail-modal').classList.remove('hidden');
      try {
        const res = await apiCall(`/orders/${orderId}`);
        const order = res.data;
        const st = statusConfig[order.status] || { label: order.status, color: 'bg-gray-100 text-gray-600' };
        document.getElementById('modal-content').innerHTML = `
          <div class="flex items-center justify-between bg-gray-50 rounded-xl p-4">
            <span class="text-xs text-gray-500">สถานะคำสั่งซื้อ</span>
            <span class="px-3 py-1 rounded-full text-xs font-medium ${st.color}">${st.label}</span>
          </div>
          <div class="bg-gray-50 rounded-xl p-4">
            <p class="text-xs text-gray-500 font-semibold uppercase mb-2">ที่อยู่จัดส่ง</p>
            <p class="text-sm text-gray-700">${order.address}</p>
          </div>
          <div>
            <p class="text-xs text-gray-500 font-semibold uppercase mb-2">รายการสินค้า</p>
            <div class="space-y-2">
              ${order.items.map(item => `
                <div class="flex items-center gap-3 bg-gray-50 rounded-lg p-2">
                  <img src="${item.image_url || 'https://picsum.photos/60'}" alt="" class="w-12 h-12 object-cover rounded-lg" />
                  <div class="flex-1">
                    <p class="text-sm font-medium text-gray-800">${item.product_name}</p>
                    <p class="text-xs text-gray-500">x${item.quantity} × ${formatPrice(item.price)}</p>
                  </div>
                  <span class="font-bold text-gray-800 text-sm">${formatPrice(item.quantity * item.price)}</span>
                </div>
              `).join('')}
            </div>
          </div>
          <div class="flex justify-between items-center bg-orange-50 rounded-xl p-4">
            <span class="text-sm text-gray-600">ชำระ: <strong>${order.payment_method === 'COD' ? 'เก็บเงินปลายทาง' : 'QR'}</strong></span>
            <span class="font-bold text-orange-500 text-lg">${formatPrice(order.total_price)}</span>
          </div>
        `;
      } catch (err) {
        document.getElementById('modal-content').innerHTML =
          `<p class="text-red-400 text-center py-8">${err.message}</p>`;
      }
    }

    function closeOrderModal() {
      document.getElementById('detail-modal').classList.add('hidden');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeOrderModal();
    });
  </script>
</body>
</html>
