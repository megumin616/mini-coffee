<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Shopee 🛒</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <!-- ============================================================ -->
  <!-- NAVBAR -->
  <!-- ============================================================ -->
  <nav class="bg-orange-500 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <!-- Logo -->
      <a href="index.html" class="text-2xl font-bold tracking-tight">🛒 Mini Coffee</a>

      <!-- Nav Links -->
      <div class="flex items-center gap-4 text-sm font-medium">
        <a href="products.html" class="hover:text-orange-100 transition">สินค้า</a>
        <a id="nav-orders" href="my-orders.html" class="hidden hover:text-orange-100 transition">📦 คำสั่งซื้อ</a>

        <!-- ปุ่ม Cart พร้อม Badge จำนวนสินค้า -->
        <a href="cart.html" class="relative hover:text-orange-100 transition">
          🛍️ ตะกร้า
          <span id="nav-cart-badge"
                class="hidden absolute -top-2 -right-3 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">
            0
          </span>
        </a>

        <!-- แสดงเมื่อ Login แล้ว -->
        <span id="nav-user" class="hidden text-orange-100"></span>
        <a id="nav-admin" href="admin.html"
           class="hidden bg-white text-orange-500 px-3 py-1 rounded-full text-xs font-bold hover:bg-orange-100 transition">
          Admin
        </a>
        <button id="nav-logout" onclick="logout()"
                class="hidden bg-orange-600 hover:bg-orange-700 px-3 py-1 rounded transition">
          ออกจากระบบ
        </button>

        <!-- แสดงเมื่อยังไม่ Login -->
        <a id="nav-login" href="login.html"
           class="bg-white text-orange-500 px-4 py-1 rounded-full font-semibold hover:bg-orange-50 transition">
          เข้าสู่ระบบ
        </a>
      </div>
    </div>
  </nav>

  <!-- ============================================================ -->
  <!-- HERO SECTION -->
  <!-- ============================================================ -->
  <section class="bg-gradient-to-br from-orange-500 to-orange-400 text-white py-20 text-center">
    <h1 class="text-5xl font-bold mb-4">ยินดีต้อนรับสู่ Mini Coffee</h1>
    <p class="text-xl text-orange-100 mb-8">สั่งเม็ลกาแฟออนไลน์ง่ายๆ ราคาดี ส่งไว</p>
    <a href="products.html"
       class="bg-white text-orange-500 font-bold px-8 py-3 rounded-full text-lg hover:bg-orange-50 shadow-lg transition inline-block">
      🔍 เลือกสั่งซื้อกาแฟ
    </a>
  </section>

  <!-- ============================================================ -->
  <!-- FEATURED PRODUCTS (โหลดจาก API) -->
  <!-- ============================================================ -->
  <section class="max-w-6xl mx-auto px-4 py-12">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">🔥 กาแฟแนะนำ</h2>
    <div id="featured-products" class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <!-- โหลดโดย JavaScript -->
      <p class="text-gray-400 col-span-4 text-center py-8">กำลังโหลดสินค้า...</p>
    </div>
    <div class="text-center mt-8">
      <a href="products.html"
         class="text-orange-500 font-semibold hover:underline">ดูสินค้าทั้งหมด →</a>
    </div>
  </section>

  <!-- ============================================================ -->
  <!-- FOOTER -->
  <!-- ============================================================ -->
  <footer class="bg-gray-800 text-gray-400 text-center py-6 mt-auto text-sm">
    <p>© 2026 Mini Coffee</p>
  </footer>

  <script src="js/api.js"></script>
  <script>
    // ============================================================
    // โหลดหน้าหลัก
    // ============================================================
    document.addEventListener('DOMContentLoaded', async () => {
      // อัปเดต Navbar ตาม Login Status
      updateNavbar();

      // โหลดสินค้าแนะนำ (แค่ 4 ชิ้น)
      try {
        const res = await apiCall('/products', 'GET', null, false);
        const products = res.data.slice(0, 4); // เอาแค่ 4 ชิ้นแรก
        renderFeaturedProducts(products);
      } catch (err) {
        document.getElementById('featured-products').innerHTML =
          '<p class="text-red-400 col-span-4 text-center">ไม่สามารถโหลดสินค้าได้</p>';
      }
    });

    // ============================================================
    // render Product Cards
    // ============================================================
    const renderFeaturedProducts = (products) => {
      const container = document.getElementById('featured-products');

      if (products.length === 0) {
        container.innerHTML = '<p class="text-gray-400 col-span-4 text-center">ยังไม่มีสินค้า</p>';
        return;
      }

      container.innerHTML = products.map(p => `
        <div class="bg-white rounded-xl shadow hover:shadow-md transition overflow-hidden">
          <img src="${p.image_url || 'https://picsum.photos/400/400'}"
               alt="${p.name}"
               class="w-full h-44 object-cover" />
          <div class="p-3">
            <p class="font-semibold text-gray-800 text-sm line-clamp-2">${p.name}</p>
            <p class="text-orange-500 font-bold mt-1">${formatPrice(p.price)}</p>
            <a href="products.html"
               class="block mt-2 text-center bg-orange-500 hover:bg-orange-600 text-white text-sm py-1.5 rounded-lg transition">
              ดูสินค้า
            </a>
          </div>
        </div>
      `).join('');
    };
  </script>
</body>
</html>
