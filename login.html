<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบ — Mini Shopee</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md">
    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-lg p-8">
      <!-- Logo -->
      <div class="text-center mb-6">
        <h1 class="text-3xl font-bold text-orange-500">🛒 Mini Shopee</h1>
        <p class="text-gray-500 text-sm mt-1">เข้าสู่ระบบเพื่อช้อปปิ้ง</p>
      </div>

      <!-- Error Message -->
      <div id="error-msg" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-lg mb-4"></div>

      <!-- Form -->
      <!-- ไม่ใช้ <form> submit ธรรมดา เพราะจะ Reload หน้า
           ใช้ onclick บน Button + Fetch API แทน -->
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">อีเมล</label>
          <input id="email" type="email" placeholder="example@email.com"
                 class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน</label>
          <input id="password" type="password" placeholder="••••••••"
                 class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400" />
        </div>

        <button onclick="handleLogin()"
                class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2.5 rounded-lg transition">
          เข้าสู่ระบบ
        </button>
      </div>

      <p class="text-center text-sm text-gray-500 mt-4">
        ยังไม่มีบัญชี?
        <a href="register.html" class="text-orange-500 font-medium hover:underline">สมัครสมาชิก</a>
      </p>
    </div>

    <p class="text-center text-xs text-gray-400 mt-4">
      <a href="index.html" class="hover:underline">← กลับหน้าหลัก</a>
    </p>
  </div>

  <script src="js/api.js"></script>
  <script>
    // ============================================================
    // ถ้า Login อยู่แล้ว → Redirect ไปหน้าสินค้าเลย
    // ============================================================
    if (isLoggedIn()) {
      window.location.href = 'products.html';
    }

    // ============================================================
    // handleLogin - ส่งข้อมูล Login ไปยัง Backend
    // ============================================================
    // Flow:
    // 1. อ่านค่าจาก Input
    // 2. เรียก POST /api/auth/login ผ่าน Fetch API
    // 3. ได้ { token, user } กลับมา
    // 4. เก็บ Token ใน localStorage
    // 5. Redirect ไปหน้าสินค้า
    // ============================================================
    const handleLogin = async () => {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-msg');

      // ซ่อน Error เก่า
      errorDiv.classList.add('hidden');

      // Validate
      if (!email || !password) {
        errorDiv.textContent = 'กรุณากรอกอีเมลและรหัสผ่าน';
        errorDiv.classList.remove('hidden');
        return;
      }

      try {
        // เรียก API Login
        // apiCall(endpoint, method, body, requireAuth)
        // auth = false เพราะยังไม่มี Token ตอน Login
        const res = await apiCall('/auth/login', 'POST', { email, password }, false);

        // บันทึก Token และ User ลง localStorage
        saveAuth(res.data.token, res.data.user);

        // Redirect ตาม Role
        if (res.data.user.role === 'ADMIN') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'products.html';
        }

      } catch (err) {
        // แสดง Error Message
        errorDiv.textContent = err.message;
        errorDiv.classList.remove('hidden');
      }
    };

    // กด Enter ที่ password field → Login
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('password').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleLogin();
      });
    });
  </script>
</body>
</html>
